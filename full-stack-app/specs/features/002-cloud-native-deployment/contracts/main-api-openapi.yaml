openapi: 3.0.3
info:
  title: Cloud-Native AI Todo Platform - Main API
  description: Main API service for the AI-powered todo platform with advanced features
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.todo-platform.com
    description: Production server

paths:
  /v1/tasks:
    get:
      summary: List user tasks with advanced filtering
      description: Retrieve tasks with support for filtering by status, priority, tags, and due date ranges
      parameters:
        - name: status
          in: query
          description: Filter by completion status
          schema:
            type: string
            enum: [all, pending, completed]
        - name: priority
          in: query
          description: Filter by priority level
          schema:
            type: string
            enum: [low, medium, high]
        - name: tags
          in: query
          description: Filter by tags (comma-separated)
          schema:
            type: string
        - name: due_from
          in: query
          description: Filter tasks with due date from this date
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          description: Filter tasks with due date to this date
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          description: Sort by field
          schema:
            type: string
            enum: [due_date, priority, created_date, title]
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
      security:
        - bearerAuth: []

    post:
      summary: Create a new task with AI assistance
      description: Create a new task with support for natural language processing through AI subagents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Task title
                  maxLength: 255
                description:
                  type: string
                  description: Task description
                  maxLength: 10000
                priority:
                  type: string
                  enum: [low, medium, high]
                  description: Task priority
                  default: medium
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 50
                  maxItems: 10
                  description: Task tags
                due_at:
                  type: string
                  format: date-time
                  description: Due date for the task
                remind_at:
                  type: string
                  format: date-time
                  description: Reminder date/time
                recurrence_rule:
                  type: string
                  enum: [daily, weekly, monthly]
                  description: Recurrence rule for recurring tasks
                ai_interpret:
                  type: boolean
                  description: Whether to use AI subagents to interpret the task
                  default: false
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
      security:
        - bearerAuth: []

  /v1/tasks/{task_id}:
    get:
      summary: Get a specific task
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Task not found
      security:
        - bearerAuth: []

    put:
      summary: Update a task
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 10000
                priority:
                  type: string
                  enum: [low, medium, high]
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 50
                  maxItems: 10
                due_at:
                  type: string
                  format: date-time
                remind_at:
                  type: string
                  format: date-time
                completed:
                  type: boolean
                recurrence_rule:
                  type: string
                  enum: [daily, weekly, monthly]
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Task not found
      security:
        - bearerAuth: []

    delete:
      summary: Delete a task
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Task not found
      security:
        - bearerAuth: []

  /v1/tasks/search:
    get:
      summary: Search tasks by content
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
      security:
        - bearerAuth: []

  /v1/chat:
    post:
      summary: AI-powered chat interface
      description: Natural language interface to interact with the todo system using AI subagents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Natural language command or query
                context:
                  type: object
                  description: Additional context for the AI
      responses:
        '200':
          description: AI response with actions taken
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: AI-generated response
                  actions:
                    type: array
                    items:
                      type: object
                      description: Actions taken by the AI
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
      security:
        - bearerAuth: []

  /v1/health:
    get:
      summary: Health check
      description: Check the health of the service and its dependencies
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  details:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [up, down]
                        message:
                          type: string

components:
  schemas:
    Task:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        priority:
          type: string
          enum: [low, medium, high]
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 10
        due_at:
          type: string
          format: date-time
        remind_at:
          type: string
          format: date-time
        completed:
          type: boolean
          default: false
        completion_date:
          type: string
          format: date-time
          readOnly: true
        recurrence_rule:
          type: string
          enum: [daily, weekly, monthly]
        user_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
      required:
        - task_id
        - title
        - user_id
        - created_at
        - updated_at

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT