apiVersion: v2
name: todo-platform
description: Umbrella chart for the Cloud-Native AI Todo Platform
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: main-api
    version: 0.1.0
    repository: "file://../main-api"
    condition: main-api.enabled
  - name: recurring-task-service
    version: 0.1.0
    repository: "file://../recurring-task-service"
    condition: recurring-task-service.enabled
  - name: notification-service
    version: 0.1.0
    repository: "file://../notification-service"
    condition: notification-service.enabled
  - name: audit-service
    version: 0.1.0
    repository: "file://../audit-service"
    condition: audit-service.enabled