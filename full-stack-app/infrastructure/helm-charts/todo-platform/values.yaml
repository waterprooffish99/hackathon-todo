# Default values for the umbrella chart

main-api:
  enabled: true
  replicaCount: 1
  image:
    repository: main-api
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  env:
    DATABASE_URL: "postgresql://user:password@postgres:5432/todo_db"
    JWT_SECRET_KEY: "your-super-secret-key-change-in-production"
    DAPR_HTTP_PORT: "3500"
    DAPR_GRPC_PORT: "50001"
  dapr:
    enabled: true
    appId: "main-api"
    config: "dapr-config"

