openapi: 3.0.0
info:
  title: Todo Evolution API
  description: API for the Todo Evolution application
  version: 1.0.0
  contact:
    name: Development Team
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.todo-evolution.com
    description: Production server

paths:
  /api/{user_id}/tasks:
    get:
      summary: Get all tasks for a user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The user's ID
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, completed, pending]
          description: Filter tasks by status
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [high, medium, low]
          description: Filter tasks by priority
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term for title/description
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, due_date, priority, title]
          description: Sort order
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: User not found
    post:
      summary: Create a new task
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The user's ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
  /api/{user_id}/tasks/{task_id}:
    get:
      summary: Get a specific task
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The user's ID
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: The task's ID
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Task not found
    put:
      summary: Update a task
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The user's ID
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: The task's ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Task not found
    patch:
      summary: Toggle task completion status
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The user's ID
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: The task's ID
      requestBody:
        required: false
      responses:
        '200':
          description: Task completion status toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Task not found
    delete:
      summary: Delete a task
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The user's ID
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: The task's ID
      responses:
        '204':
          description: Task deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Task not found
  /api/{user_id}/chat:
    post:
      summary: Send message to chatbot
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The user's ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: Unauthorized

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - user_id
        - title
        - completed
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the task
        user_id:
          type: string
          description: ID of the user who owns the task
        title:
          type: string
          description: Task title (1-200 characters)
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Task description (0-1000 characters)
          maxLength: 1000
        completed:
          type: boolean
          description: Whether the task is completed
        priority:
          type: string
          description: Task priority (high, medium, low)
          enum: [high, medium, low]
        tags:
          type: array
          items:
            type: string
          description: Array of tags for the task (max 5)
          maxItems: 5
        due_date:
          type: string
          format: date-time
          description: When the task is due
        recurrence:
          type: string
          description: Recurrence pattern for the task
          enum: [daily, weekly, monthly, yearly]
        created_at:
          type: string
          format: date-time
          description: When the task was created
        updated_at:
          type: string
          format: date-time
          description: When the task was last updated
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Task title (1-200 characters)
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Task description (0-1000 characters)
          maxLength: 1000
        priority:
          type: string
          description: Task priority (high, medium, low)
          enum: [high, medium, low]
        tags:
          type: array
          items:
            type: string
          description: Array of tags for the task (max 5)
          maxItems: 5
        due_date:
          type: string
          format: date-time
          description: When the task is due
        recurrence:
          type: string
          description: Recurrence pattern for the task
          enum: [daily, weekly, monthly, yearly]
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: New task title (1-200 characters)
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: New task description (0-1000 characters)
          maxLength: 1000
        priority:
          type: string
          description: New task priority (high, medium, low)
          enum: [high, medium, low]
        tags:
          type: array
          items:
            type: string
          description: New array of tags for the task (max 5)
          maxItems: 5
        due_date:
          type: string
          format: date-time
          description: New due date for the task
        recurrence:
          type: string
          description: New recurrence pattern for the task
          enum: [daily, weekly, monthly, yearly]
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The user's message to the chatbot
        conversation_id:
          type: string
          description: ID of the conversation (optional, creates new if not provided)
    ChatResponse:
      type: object
      required:
        - response
        - conversation_id
      properties:
        response:
          type: string
          description: The chatbot's response
        conversation_id:
          type: string
          description: ID of the conversation
        action_performed:
          type: string
          description: Action taken by the agent (if any)